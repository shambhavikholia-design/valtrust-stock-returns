<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Returns Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 17 9 11 13 15 21 6"></polyline>
          <polyline points="14 6 21 6 21 13"></polyline>
        </svg>
        <span>Stock Returns</span>
      </div>
      <span class="brand-sub">NSE data</span>
    </header>

    <section class="search-section">
      <label for="ticker-input" class="search-label">Enter NSE ticker symbol</label>
      <div class="search-row">
        <input
          type="text"
          id="ticker-input"
          placeholder="Ticker symbol, e.g. RELIANCE, TCS, INFY"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="go-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Get returns
        </button>
      </div>
      <p id="input-error" class="input-error" hidden></p>
    </section>

    <main id="panel" class="panel"></main>

    <footer class="app-footer">
      <span>Prices and returns are computed from IndianAPI data. Past returns don't guarantee future performance.</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
